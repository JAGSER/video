<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="a/icon192.png">
<title>Video</title>
<style>
:root{--bg:#0B0B0F;--p1:#17171D;--p2:#23232C;--mut:#5A5A6A;--lime:#C6FF3D;--blue:#3D8BFF;--orng:#FF7A1A;--pink:#FF4FA3;--vio:#8B6CFF;--yel:#FFD43B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;position:relative}
header{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
header h1{font-size:17px;font-weight:900;letter-spacing:.5px;flex:1}
header h1 b{color:var(--lime)}
.btn{border:0;border-radius:14px;background:var(--p2);color:#fff;font:700 13px Inter,system-ui,sans-serif;padding:9px 13px;cursor:pointer;transition:transform .15s,background .2s}
.btn:active{transform:scale(.94)}
.btn.lime{background:var(--lime);color:#111}
.btn.ic{width:38px;height:38px;padding:0;font-size:17px;display:grid;place-items:center}
#stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative;padding:0 12px}
#cv{height:100%;max-height:100%;aspect-ratio:9/16;max-width:100%;border-radius:18px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.6);touch-action:manipulation}
#playbtn{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(198,255,61,.55);color:#111;font-size:22px;border:0;display:grid;place-items:center;transition:opacity .25s,transform .25s;pointer-events:none}
#demoTag{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--lime);color:#111;font-weight:900;font-size:14px;padding:11px 16px;border-radius:16px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:5;cursor:pointer}
#demoTag.off{display:none}
#playbtn.hide{opacity:0;transform:scale(.6)}
#busy{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(11,11,15,.82);backdrop-filter:blur(6px);z-index:30;text-align:center;padding:30px}
#busy.on{display:flex}
#busy .t{font-weight:800;font-size:16px}
#busy .s{font-size:13px;color:#aaa;max-width:300px}
.scan{width:220px;height:8px;border-radius:4px;background:var(--p2);overflow:hidden;position:relative}
.scan i{position:absolute;left:0;top:0;height:100%;width:40%;background:linear-gradient(90deg,var(--blue),var(--lime));border-radius:4px;animation:scan 1.1s ease-in-out infinite}
.scan.det i{animation:none;width:0;transition:width .3s}
@keyframes scan{0%{left:-40%}100%{left:100%}}
/* линия видео */
#lineWrap{padding:10px 14px 4px;position:relative}
#line{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--p1);gap:2px;position:relative}
.pc{flex-basis:0;min-width:0;transition:flex-grow .8s cubic-bezier(.6,0,.2,1),background .4s,opacity .4s;border-radius:6px;position:relative;overflow:hidden}
.pc.k{background:linear-gradient(180deg,#3D8BFF,#2a62c0)}
.pc.k.g{background:linear-gradient(180deg,#5c6b85,#3d4658)}
.pc.k:nth-child(odd){filter:brightness(1.12)}
.pc.x{background:repeating-linear-gradient(45deg,#ff4a5a 0 4px,#7a1f2a 4px 8px);opacity:.9}
.pc.x::after{content:"";position:absolute;inset:0;animation:cut .8s ease}
@keyframes cut{0%{background:#fff}100%{background:transparent}}
#chips{position:relative;height:30px;margin-top:4px}
.ch{position:absolute;top:0;transform:translateX(-50%);width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--p2);border:2px solid transparent;transition:left .8s cubic-bezier(.6,0,.2,1),transform .25s,border-color .2s;cursor:pointer}
.ch.sel{border-color:var(--lime);transform:translateX(-50%) scale(1.18)}
.ch.new{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:translateX(-50%) scale(0) rotate(-40deg)}100%{transform:translateX(-50%) scale(1)}}
#ph{position:absolute;top:6px;width:3px;height:70px;margin-left:-1px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff;pointer-events:none;z-index:3}
#tinfo{display:flex;justify-content:space-between;font-size:11px;color:#8a8a9a;padding:0 2px;margin-top:2px}
/* режимы */
#modes{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 6px;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
.md{flex:none;border:0;border-radius:20px;padding:8px 14px;background:var(--p2);color:#ddd;font:700 13px Inter,system-ui,sans-serif;transition:background .2s,color .2s}
.md.on{background:var(--lime);color:#111}
#panel{padding:4px 12px 6px;min-height:118px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vhead{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#8a8a9a;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.car{position:relative;height:64px;background:var(--p1);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.car .nm{font-weight:900;font-size:19px;display:flex;align-items:center;gap:10px;animation:enter .35s cubic-bezier(.3,1.4,.5,1)}
.car .nm .e{font-size:26px}
@keyframes enter{0%{transform:translateX(calc(var(--ed,1)*60px));opacity:0}100%{transform:none;opacity:1}}
.car .ar{position:absolute;top:0;bottom:0;width:44px;border:0;background:transparent;color:#888;font-size:22px}
.car .ar.l{left:0}.car .ar.r{right:0}
.like{color:#fff}
.like.on{background:var(--pink)!important}
.dots{display:flex;gap:4px;justify-content:center;margin-top:6px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--p2);transition:width .2s,background .2s}
.dots i.on{width:16px;background:var(--lime)}
.dots i.lk{background:var(--pink)}
.fld{width:100%;background:var(--p1);border:1px solid #2c2c36;border-radius:12px;color:#fff;padding:9px 11px;font:600 14px Inter,system-ui,sans-serif;outline:none}
.fld:focus{border-color:var(--lime)}
.tog{display:flex;align-items:center;gap:8px;background:var(--p1);border-radius:14px;padding:9px 12px;font-size:13px;font-weight:700;flex:1;min-width:140px}
.tog i{width:34px;height:20px;border-radius:10px;background:var(--mut);position:relative;transition:background .2s;flex:none}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on i{background:var(--lime)}.tog.on i::after{left:16px}
.hint{font-size:12px;color:#8a8a9a;margin-top:6px}
/* голос */
#voice{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 30%)}
#cmd{flex:1;background:var(--p1);border:1px solid #2c2c36;border-radius:22px;color:#fff;padding:0 16px;height:44px;font:600 14px Inter,system-ui,sans-serif;outline:none}
#cmd:focus{border-color:var(--lime)}
#mic{width:44px;height:44px;border-radius:50%;border:0;background:var(--vio);color:#fff;font-size:19px;flex:none;position:relative}
#mic.on{background:var(--pink);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,79,163,.7)}100%{box-shadow:0 0 0 16px rgba(255,79,163,0)}}
#send{width:44px;height:44px;border-radius:50%;border:0;background:var(--lime);color:#111;font-size:18px;flex:none;font-weight:900}
#toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-20px);opacity:0;background:#fff;color:#111;font-weight:800;font-size:13px;padding:10px 16px;border-radius:16px;z-index:40;transition:all .3s cubic-bezier(.3,1.4,.5,1);max-width:90%;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.ai{background:var(--lime)}
/* настройки */
#sheet{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet .in{background:var(--p1);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}}
#sheet h3{font-size:16px}
#sheet label{font-size:12px;color:#aaa;font-weight:700}
#dl{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>VIDEO<b>.</b></h1>
    <button class="btn ic" id="bSet" title="Настройки" style="display:none">⚙</button>
    <label class="btn lime" for="file" id="bUp">＋ Своё видео</label>
    <input type="file" id="file" accept="video/*" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
  </header>
  <div id="stage">
    <canvas id="cv" width="1080" height="1920"></canvas>
    <div id="playbtn">▶</div>
    <div id="busy"><div class="t" id="busyT">Загрузка</div><div class="scan" id="busyBar"><i></i></div><div class="s" id="busyS"></div></div>
  </div>
  <div id="lineWrap">
    <div id="line"></div>
    <div id="chips"></div>
    <div id="ph"></div>
    <div id="tinfo"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
  </div>
  <div id="modes">
    <button class="md on" data-m="mont">✂ Монтаж</button>
    <button class="md" data-m="ins">✨ Вставки</button>
    <button class="md" data-m="sub">💬 Субтитры</button>
    <button class="md" data-m="exp">⬇ Скачать MP4</button>
  </div>
  <div id="panel"></div>
  <div id="voice">
    <input id="cmd" placeholder="Скажи или напиши правку…" enterkeyhint="send" autocomplete="off">
    <button id="mic" title="Голосом">🎤</button>
    <button id="send">➜</button>
  </div>
  <div id="toast"></div>
  <div id="sheet"><div class="in">
    <h3>Расшифровка и ИИ</h3>
    <label>Ключ Gemini API (aistudio.google.com, оплата с ваших Cloud-кредитов)</label>
    <input class="fld" id="sKey" placeholder="AIza…" autocomplete="off">
    <label>Или прослойка «Помощника»: адрес, логин, пароль</label>
    <input class="fld" id="sProxy" placeholder="https://…">
    <div class="row"><input class="fld" id="sUser" placeholder="логин" style="flex:1"><input class="fld" id="sPass" placeholder="пароль" type="password" style="flex:1"></div>
    <div class="row"><button class="btn lime" id="sSave" style="flex:1">Сохранить</button><button class="btn" id="sClose">Закрыть</button></div>
    <div class="hint">Видео не уходит в интернет: в Gemini отправляется только звук, монтаж и сборка MP4 идут прямо в телефоне.</div>
  </div></div>
  <a id="dl"></a>
</div>
<video id="vA" playsinline preload="auto" crossorigin="anonymous" style="display:none"></video>
<video id="vB" playsinline preload="auto" crossorigin="anonymous" style="display:none"></video>
<script>
"use strict";
/* ================= утилиты ================= */
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={
  out3:t=>1-Math.pow(1-clamp(t),3),
  out2:t=>1-Math.pow(1-clamp(t),2),
  in2:t=>Math.pow(clamp(t),2),
  in4:t=>Math.pow(clamp(t),4),
  back:(t,s=1.70158)=>{t=clamp(t)-1;return t*t*((s+1)*t+s)+1},
  sine:t=>-(Math.cos(Math.PI*clamp(t))-1)/2,
};
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60);return m+":"+String(s).padStart(2,"0")};
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= вставки: ИИ собирает каждую из элементов ================= */
const SUBS={
  karaoke:{n:"Караоке жёлтым",e:"🟨"},
  pop:{n:"По слову с прыжком",e:"🔤"},
  type:{n:"Печать на плашке",e:"⌨️"},
  neon:{n:"Неон",e:"🌈"},
  wave:{n:"Волна",e:"〰️"},
  off:{n:"Без субтитров",e:"🚫"},
};
const SUB_KEYS=Object.keys(SUBS);
const GFX_DOC=`Холст 1080x1920 (x вправо, y вниз). Вставка (insert):
{"t":сек_начала,"d":длительность,"icon":"один эмодзи для таймлайна","idea":"зачем эта вставка, 3-6 слов","sfx":"pop|thud|none",
 "cam":{"zoom":1.0-1.35,"zoomAt":сек_от_начала,"shake":0-30,"shakeAt":сек,"flash":true|false,"dim":0-0.7},
 "layers":[слой,...]}
Слои (у всех: "x","y" центр, "rot" градусы, "at" задержка появления от начала вставки, "dur" сколько живёт (по умолчанию до конца),
 "in": pop|slam|drop|rise|left|right|fade|spin|stamp|none, "out": fade|pop|up|left|right|none, "loop": none|bob|pulse|wiggle|spin|shake):
 {"k":"text","text":"текст, \\n перенос","size":40-220,"font":"b(жирный гротеск)|m(полужирный)|l(курсив с засечками)","color":"#hex","stroke":"#hex или пусто","box":{"color":"#hex или rgba","r":0-60,"pad":10-50},"stagger":"none|word|letter|type","step":0.04-0.4,"hl":["слова","для подсветки"],"hlColor":"#hex","maxW":300-1000}
 {"k":"emoji","ch":"🔥","size":60-300,"fx":"none|float|rain|burst","n":1-20}
 {"k":"shape","sh":"rect|circle|heart|star|arrow|line|ring|burst|underline","w":..,"h":..,"x2":..,"y2":..,"fill":"#hex или пусто","stroke":"#hex","sw":4-20,"draw":true (рисуется линией)}
 {"k":"frame","w":..,"h":..,"cx":..,"cy":..,"s":1.5-3,"bcolor":"#hex","b":4-30,"caption":"подпись"} (окно-лупа: увеличенный кусок кадра вокруг точки cx,cy)`;

/* ===== движок слоёв ===== */
function hash(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function animIn(kind,q){
  const r={dx:0,dy:0,sc:1,rot:0,al:1};q=clamp(q);
  switch(kind){
    case"pop":r.sc=E.back(q,2.4);r.al=clamp(q*3);break;
    case"slam":r.sc=lerp(1.45,1,E.out3(clamp(q/.6)));r.al=clamp(q*3);break;
    case"stamp":r.sc=lerp(1.5,1,E.out3(clamp(q/.6)));r.rot=lerp(-10,0,E.out3(clamp(q/.6)));r.al=clamp(q*3);break;
    case"drop":r.dy=-160*(1-E.back(q,1.4));r.al=clamp(q*3);break;
    case"rise":r.dy=140*(1-E.out3(q));r.al=q;break;
    case"left":r.dx=-220*(1-E.out3(q));r.al=q;break;
    case"right":r.dx=220*(1-E.out3(q));r.al=q;break;
    case"spin":r.rot=-200*(1-E.out3(q));r.sc=E.out3(q);break;
    case"fade":r.al=q;break;
  }
  return r;
}
function animOut(kind,q){
  const r={dx:0,dy:0,sc:1,rot:0,al:1};q=clamp(q);if(q<=0)return r;
  switch(kind){
    case"pop":r.sc=1-E.in2(q);break;
    case"up":r.dy=-160*E.in2(q);r.al=1-q;break;
    case"left":r.dx=-760*E.in2(q);break;
    case"right":r.dx=760*E.in2(q);break;
    case"none":break;
    default:r.al=1-q;
  }
  return r;
}
function loopFx(kind,t){
  const r={dx:0,dy:0,sc:1,rot:0};
  if(kind=="bob")r.dy=Math.sin(t*4)*12;
  if(kind=="pulse")r.sc=1+Math.sin(t*7)*.05;
  if(kind=="wiggle")r.rot=Math.sin(t*9)*4;
  if(kind=="spin")r.rot=t*120;
  
  return r;
}
function star(cx,cy,r1,r2,n=5){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=-Math.PI/2+i*Math.PI/n;ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}ctx.closePath()}
function wrapLines(text,px,font,maxW){
  const out=[];for(const para of String(text).split("\n")){let line=[];for(const w of para.split(/\s+/).filter(Boolean)){const tryL=line.concat(w).join(" ");if(line.length&&tw(tryL,px,font)>maxW){out.push(line);line=[w]}else line.push(w)}out.push(line)}
  return out;
}
function drawText(L,lp,ld){
  const font=["b","m","l"].includes(L.font)?L.font:"b";let px=clamp(+L.size||80,16,260);const maxW=clamp(+L.maxW||960,120,1040);
  let lines=wrapLines(L.text||"",px,font,maxW);
  while(px>24&&lines.some(l=>tw(l.join(" "),px,font)>1040)){px-=4;lines=wrapLines(L.text||"",px,font,maxW)}
  const lh=px*1.12,H=lines.length*lh,gap=tw(" ",px,font);
  {const W=Math.max(...lines.map(l=>tw(l.join(" "),px,font)))+(L.box?2*clamp(+L.box.pad||24,0,80):0),x=+L.x||540;const fx=Math.max(0,30-(x-W/2))-Math.max(0,(x+W/2)-1050);if(fx)ctx.translate(fx,0)}
  const hl=(L.hl||[]).map(w=>norm(w).replace(/[.,!?«»"]/g,""));
  const st=L.stagger||"none",step=clamp(+L.step||.12,.02,.6);
  if(L.box){
    const W=Math.max(...lines.map(l=>tw(l.join(" "),px,font)));const pad=clamp(+L.box.pad||24,0,80);
    ctx.fillStyle=L.box.color||"rgba(0,0,0,.75)";rr(-W/2-pad,-H/2-pad*.7,W+pad*2,H+pad*1.4,clamp(+L.box.r||20,0,80));ctx.fill();
  }
  let wi=0,ci=0;
  lines.forEach((ln,li)=>{
    const lw=tw(ln.join(" "),px,font);let x=-lw/2;const y=-H/2+li*lh+px*.86;
    ln.forEach(w=>{
      const ww=tw(w,px,font);const isHl=hl.includes(norm(w).replace(/[.,!?«»"]/g,""));
      const col=isHl?(L.hlColor||"#FFD43B"):(L.color||"#fff");
      const o={f:font,al:"left",c:col};if(L.stroke)Object.assign(o,{st:L.stroke,sw:Math.max(6,px*.12)});else o.sh="rgba(0,0,0,.55)",o.sb=18,o.sy=4;
      if(st=="word"){const q=(lp-wi*step)/.2;if(q>0){ctx.save();ctx.globalAlpha*=clamp(q*2);ctx.translate(x+ww/2,y+30*(1-clamp(q)));const s=lerp(.6,1,E.back(q,2.5));ctx.scale(s,s);txt(w,-ww/2,0,px,o);ctx.restore()}}
      else if(st=="letter"||st=="type"){let cx=x;for(const ch of w){const q=(lp-ci*step)/(st=="type"?.01:.18);if(q>0){const cw=tw(ch,px,font);ctx.save();ctx.globalAlpha*=clamp(q*2);ctx.translate(cx,y+(st=="letter"?50*(1-E.back(q,3)):0));txt(ch,0,0,px,o);ctx.restore()}cx+=tw(ch,px,font);ci++}ci++}
      else txt(w,x,y,px,o);
      x+=ww+gap;wi++;
    });
  });
}
function drawShape(L,lp,ld){
  const w=+L.w||200,h=+L.h||w,sw=clamp(+L.sw||10,1,40),draw=!!L.draw;
  const prog=draw?E.out2(lp/.45):1;
  ctx.lineWidth=sw;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=L.stroke||"#fff";ctx.fillStyle=L.fill||"transparent";
  const doPath=(len)=>{if(L.fill&&!draw)ctx.fill();if(L.stroke||draw){if(draw){ctx.setLineDash([len,len]);ctx.lineDashOffset=len*(1-prog)}ctx.stroke();ctx.setLineDash([])}};
  switch(L.sh){
    case"circle":ctx.beginPath();ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);doPath(Math.PI*(w+h));break;
    case"ring":ctx.beginPath();ctx.ellipse(0,0,w/2,h/2,0,-Math.PI/2,-Math.PI/2+Math.PI*2*prog);ctx.stroke();break;
    case"heart":ctx.save();ctx.scale(w/120,h/110);heart(0,0,1);ctx.restore();doPath(420*w/120);break;
    case"star":star(0,0,w/2,w/4.4);doPath(w*3.5);break;
    case"burst":star(0,0,w/2,w/3.2,12);doPath(w*5);break;
    case"underline":ctx.beginPath();ctx.moveTo(-w/2,0);ctx.quadraticCurveTo(0,h*.25,w/2,-h*.1);doPath(w*1.2);break;

let S={dur:0,words:[],keep:[],inserts:[],cuts:[],subStyle:"karaoke",removePauses:false,jumpZoom:true,title:"",src:null,name:""};

let hist=[];

const snap=()=>JSON.stringify({words:S.words,keep:S.keep,inserts:S.inserts,cuts:S.cuts,subStyle:S.subStyle,removePauses:S.removePauses,jumpZoom:S.jumpZoom});

/* ================= разметка времени ================= */
function subtract(iv,cut){const out=[];for(const [a,b] of iv){let parts=[[a,b]];for(const k of cut){const n=[];for(const [x,y] of parts){if(k.e<=x||k.s>=y){n.push([x,y]);continue}if(k.s>x)n.push([x,k.s]);if(k.e<y)n.push([k.e,y])}parts=n}out.push(...parts)}return out}
function rebuild(){
  const thr=0.45,pad=0.08,w=S.words.filter(x=>!x.del);
  let gaps=[];
  for(let i=0;i<=w.length;i++){
    const a=i==0?0:w[i-1].e+pad, b=i==w.length?S.dur:w[i].s-pad;
    if(b-a>thr)gaps.push([a,b]);
  }
  if(!w.length)gaps=[];
  gaps=subtract(gaps,S.keep).filter(([a,b])=>b-a>thr);
  const cuts=S.cuts.map(c=>[c.s,c.e]);
  const bs=new Set([0,S.dur]);
  for(const [a,b] of gaps.concat(cuts)){bs.add(+a.toFixed(3));bs.add(+b.toFixed(3))}
  const B=[...bs].filter(x=>x>=0&&x<=S.dur).sort((a,b)=>a-b);
  const pieces=[];
  for(let i=0;i<B.length-1;i++){
    const s=B[i],e=B[i+1];if(e-s<0.01)continue;const m=(s+e)/2;
    const gap=gaps.some(([a,b])=>m>a&&m<b), cut=cuts.some(([a,b])=>m>a&&m<b);
    pieces.push({s,e,gap,cut,keep:!(gap&&S.removePauses)&&!cut});
  }
  const segs=[];let o=0;
  for(const p of pieces){if(!p.keep)continue;const L=segs[segs.length-1];if(L&&Math.abs(L.e-p.s)<0.002){L.e=p.e}else segs.push({s:p.s,e:p.e})}

  R={pieces,segs,outDur:o};
  for(const x of S.words){x.os=mapOut(x.s);x.oe=mapOut(x.e);x.off=x.del||!inKept(x.s+Math.min(0.05,(x.e-x.s)/2))}
  for(const n of S.inserts){n.o=mapOut(n.t);n._fb=faceBox(n);n._fv=(n._fv||0)+1}
  S.inserts.sort((a,b)=>a.o-b.o);
  buildChunks();
  drawLine();
  if(!P.playing)seekOut(Math.min(P.T,R.outDur-0.01));
}
function inKept(t){return R.segs.some(g=>t>=g.s&&t<g.e)}
function mapOut(t){for(const g of R.segs){if(t<g.s)return g.o;if(t<=g.e)return g.o+t-g.s}return R.outDur}

function buildChunks(){
  const w=S.words.filter(x=>!x.off);CH=[];let cur=[];
  for(let i=0;i<w.length;i++){
    if(cur.length&&(cur.length>=3||w[i].s-cur[cur.length-1].e>0.6||/[.!?…,;:]$/.test(cur[cur.length-1].w))){CH.push(cur);cur=[]}
    cur.push(w[i]);
  }
  if(cur.length)CH.push(cur);
  CH.forEach((c,i)=>{c.s=c[0].os;c.e=i<CH.length-1?Math.min(CH[i+1][0].os,c[c.length-1].oe+0.6):c[c.length-1].oe+0.6});

/* ================= плеер (два видео поочерёдно, без рывков на склейках) ================= */
const cv=$("#cv"),ctx=cv.getContext("2d");
const P={v:[$("#vA"),$("#vB")],cur:0,i:0,T:0,playing:false,lastT:0,rec:null};
let AC=null,master=null,recDest=null,SFX={};
function initAudio(){
  if(AC){AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.connect(AC.destination);
    recDest=AC.createMediaStreamDestination();master.connect(recDest);
    for(const v of P.v){const s=AC.createMediaElementSource(v);s.connect(master)}
    for(const n of ["pop","thud","whoosh"])fetch("a/"+n+".wav").then(r=>r.arrayBuffer()).then(b=>AC.decodeAudioData(b)).then(b=>SFX[n]=b).catch(()=>{});
  }catch(e){console.warn(e)}
}
function sfx(n,vol){if(!AC||!SFX[n])return;const s=AC.createBufferSource();s.buffer=SFX[n];const g=AC.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start()}
const curV=()=>P.v[P.cur];
function prep(el,i){if(i<R.segs.length){try{el.currentTime=R.segs[i].s}catch(e){}}}
async function play(){
  if(!R.segs.length)return;
  initAudio();
  if(P.T>=R.outDur-0.05)P.T=0;
  const m=mapSrc(P.T);P.i=m.i;
  const el=curV();
  if(Math.abs(el.currentTime-m.src)>0.04){el.currentTime=m.src;await new Promise(r=>el.addEventListener("seeked",r,{once:true}))}
  prep(P.v[1-P.cur],P.i+1);
  P.playing=true;P.lastT=P.T;$("#playbtn").classList.add("hide");
  try{await el.play()}catch(e){P.playing=false;$("#playbtn").classList.remove("hide")}
}
function pause(){P.playing=false;P.v.forEach(v=>v.pause());$("#playbtn").classList.remove("hide")}

  P.T=clamp(T,0,Math.max(0,R.outDur-0.001));const m=mapSrc(P.T);P.i=m.i;
  const el=curV();if(!el.src)return;
  try{el.currentTime=m.src}catch(e){}
  el.addEventListener("seeked",()=>{if(!P.playing)render(P.T)},{once:true});
  render(P.T);
}
function step(){
  if(P.playing){
    const el=curV(),g=R.segs[P.i];
    let src=el.currentTime;
    if(src>=g.e-0.012||el.ended){
      if(P.i+1<R.segs.length){
        const nx=P.v[1-P.cur];nx.play().catch(()=>{});el.pause();
        P.cur=1-P.cur;P.i++;src=R.segs[P.i].s;
        setTimeout(()=>prep(el,P.i+1),60);
      }else{P.T=R.outDur;finish();}
    }
    if(P.playing){
      const g2=R.segs[P.i];
      P.T=g2.o+clamp(src-g2.s,0,g2.e-g2.s);
      for(const n of S.inserts){if(n.o>P.lastT&&n.o<=P.T+0.01&&n.sfx&&(n.sfx=="pop"||n.sfx=="thud"))sfx(n.sfx,n.sfx=="thud"?0.35:0.22)}
      P.lastT=P.T+0.01;
    }
  }
  render(P.T);
  updHead();
  requestAnimationFrame(step);
}
function finish(){pause();if(P.rec){P.rec.stop()}}

const PLAN_PROMPT=(D,frames)=>`Ты лучший монтажёр и моушн-дизайнер вертикальных рилсов, уровень популярных роликов «монтаж через Claude»: каждая графическая вставка что-то добавляет к смыслу, шутит, поясняет, подчёркивает эмоцию или указывает на предмет в кадре.
Приложены звук ролика (${D.toFixed(1)} с) и кадры с временем: ${frames.map(f=>f.t.toFixed(1)).join(", ")} с.
Сначала пойми ролик: о чём он, кто говорит, где лицо и важные предметы в кадре, настроение, где смешно, где пик. Потом смонтируй.
Верни ТОЛЬКО JSON:
{"title":"о чём ролик, 2-4 слова","lang":"язык речи","palette":["#hex","#hex","#hex"],
"faces":[{"t":сек кадра,"x":лево,"y":верх,"w":ширина,"h":высота}] (лицо главного человека на КАЖДОМ кадре, в координатах холста 1080x1920: кадры приложены уменьшенными в 4 раза, умножь на 4; от лба до подбородка),
"words":[{"w":"слово","s":сек,"e":сек}],
"keep":[{"s":сек,"e":сек}],
"inserts":[вставка,...]}
words: субтитры НА РУССКОМ по реальному звуку (если речь не русская, живой короткий перевод каждой фразы, слова перевода разложены по времени фразы).
keep: смех, реакции, важные паузы, которые нельзя вырезать.
inserts: одна вставка на каждые 2-4 секунды, не накладываются. Правила:
- Каждая вставка придумана именно под этот момент ролика: что сказано и что видно. Никаких общих фраз, никаких шаблонов.
- Разные идеи по ходу ролика: заголовок-крючок в первые 1.5 с, подписи и ярлыки к людям и предметам со стрелками, крупные выкрики, ироничные комментарии, эмодзи-реакции, счётчики и рейтинги, окно-лупа на деталь, ключевые слова цитатой, финальный панчлайн.
- Единая палитра ролика (palette), у текстов обводка или плашка для читаемости.
- Никогда не закрывай лицо и глаза. Основное место для текстов и плашек: нижняя половина кадра, y от 1000 до 1320 (над субтитрами), или свободный край рядом с предметом. Выше лица только если там пусто и это заголовок. Субтитры внизу (y 1380-1500), туда не ставь.
- Анимации спокойные и чистые, как у профессиональных моушн-дизайнеров: pop, rise, fade, мягкий slam. Вспышка flash и тряска shake максимум 1-2 раза за ролик. sfx: pop или none.
- Анимации и композиция меняются от вставки к вставке; удары (slam, stamp, shake, zoom, flash) только на пиках.
- Тексты по-русски, короткие, живые.
${GFX_DOC}`;
let lastPlan=null;
async function analyze(file){
  try{
    busy(1,"ИИ смотрит ролик…","Готовлю кадры",0);
    const frames=await grabFrames(S.src,S.dur);
    busy(1,"ИИ слушает ролик…","Достаю звук",.35);
    const wav=await audioWav(file);
    if(wav.size>14e6)throw new Error("ролик слишком длинный, до 5 минут");
    const parts=[{mime:"audio/wav",data:await b64(wav)}];
    for(const f of frames){parts.push({text:"кадр t="+f.t.toFixed(1)+" с"});parts.push({mime:"image/jpeg",data:f.data})}
    busy(1,"ИИ монтирует…","Понимает смысл, пишет субтитры, придумывает вставки. Обычно до минуты.",.5);
    const t=await askAI(PLAN_PROMPT(S.dur,frames),parts);
    applyPlan(parseJSON(t));busy(0);toast("✨ Смонтировано: "+S.inserts.length+" вставок",1,4000);
  }catch(e){busy(0);toast("Ошибка: "+e.message,0,6000);console.error(e)}
}
function applyPlan(j){
  lastPlan=j;pushHist();
  S.words=(j.words||[]).filter(w=>w&&w.w&&isFinite(w.s)).map(w=>({w:String(w.w),s:+w.s,e:isFinite(w.e)&&w.e>w.s?+w.e:+w.s+0.3})).sort((a,b)=>a.s-b.s);
  S.keep=(j.keep||[]).filter(k=>isFinite(k.s)&&isFinite(k.e)).map(k=>({s:+k.s,e:+k.e}));
  S.inserts=(j.inserts||[]).filter(n=>n&&isFinite(n.t)).map(n=>cleanIns(n));
  S.faces=(j.faces||[]).filter(f=>f&&[f.t,f.x,f.y,f.w,f.h].every(isFinite)).map(f=>({t:+f.t,x:+f.x,y:+f.y,w:+f.w,h:+f.h}));
  S.cuts=[];S.title=j.title||"";
  rebuild();panel(0);seekOut(0);
}
async function autoMontage(){if(S.file)analyze(S.file)}

/* ================= загрузка видео ================= */
$("#file").onchange=async e=>{
  const file=e.target.files[0];if(!file)return;e.target.value="";
  pause();busy(1,"Открываю видео…");
  const url=URL.createObjectURL(file);
  await loadSrc(url);S.file=file;S.name=file.name;
  S.words=[];S.keep=[];S.inserts=[];S.cuts=[];S.removePauses=false;hist=[];lastPlan=null;
  rebuild();panel(0);seekOut(0);
  analyze(file);
};
function loadSrc(url){
  S.src=url;
  return Promise.all(P.v.map(v=>new Promise((res,rej)=>{v.onloadeddata=()=>res();v.onerror=()=>rej(new Error("видео не открылось"));v.src=url;v.load()}))).then(()=>{S.dur=P.v[0].duration;P.cur=0}).catch(e=>{busy(0);toast(e.message)});
}

/* ================= экспорт MP4 ================= */
async function exportMp4(){
  if(!R.segs.length)return;
  initAudio();await AC.resume();
  const q=LS.get("mnt_q",1080);
  const types=["video/mp4;codecs=avc1.640028,mp4a.40.2","video/mp4;codecs=avc1.42E01F,mp4a.40.2","video/mp4;codecs=avc1,mp4a.40.2","video/mp4;codecs=avc1,opus","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm"];
  const mime=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!mime){toast("Браузер не умеет записывать видео");return}
  setRes(q);
  const vs=cv.captureStream(30);const st=new MediaStream([...vs.getVideoTracks(),...recDest.stream.getAudioTracks()]);
  const rec=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:q==1080?12e6:7e6,audioBitsPerSecond:192000});
  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const done=new Promise(r=>rec.onstop=r);
  P.T=0;seekOut(0);await new Promise(r=>setTimeout(r,400));
  P.rec=rec;rec.start(500);
  const iv=setInterval(()=>busy(1,"Собираю MP4…",fmt(P.T)+" / "+fmt(R.outDur)+" · не выключайте экран",P.T/R.outDur),250);
  await play();
  await done;clearInterval(iv);P.rec=null;busy(0);setRes(1080);
  const ext=mime.includes("mp4")?"mp4":"webm";
  const blob=new Blob(chunks,{type:mime.split(";")[0]});
  const name="montazh_"+new Date().toISOString().slice(0,16).replace(/[-:T]/g,"")+"."+ext;
  window.__lastExport={size:blob.size,mime,name};window.__lastBlob=blob;
  await saveFile(blob,name);
}
async function saveFile(blob,name){
  const dlns=window.claude&&window.claude.use?await Promise.race([window.claude.use("downloads").catch(()=>null),new Promise(r=>setTimeout(()=>r(null),4000))]):null;
  if(dlns){
    try{await dlns.save({filename:name,data:blob});toast("⬇ Сохранено: "+name,1,5000);return}
    catch(e){if(e&&e.code=="declined"){toast("Сохранение отменено");return}}
  }
  const a=$("#dl");a.href=URL.createObjectURL(blob);a.download=name;a.click();
  toast("⬇ Готово: "+name+" ("+(blob.size/1e6).toFixed(1)+" МБ)",1,5000);
}
function setRes(q){Q=q/1080;cv.width=Math.round(1080*Q);cv.height=Math.round(1920*Q)}

/* ================= старт ================= */
async function loadFonts(){
  const L=[["InterBlack","a/Inter-Black.otf",{weight:"900"}],["InterBold","a/Inter-Bold.otf",{weight:"700"}],["LoraI","a/Lora-Italic-Variable.ttf",{style:"italic"}]];
  await Promise.all(L.map(([n,u,o])=>new FontFace(n,`url(${u})`,o).load().then(ff=>document.fonts.add(ff)).catch(()=>{})));
}
$("#stage").addEventListener("click",e=>{if(e.target.closest("#busy")||!S.src)return;initAudio();P.playing?pause():play()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&P.playing&&!P.rec)pause()});
window.addEventListener("resize",updHead);
(async()=>{
  await loadFonts();
  rebuild();panel(0);
  requestAnimationFrame(step);
  if(window.claude&&window.claude.use){window.claude.use("dictation").then(d=>{if(!d)return;DICT=d;let acc="";d.onPartial(({text})=>{$("#cmd").value=acc+text});d.onFinal(({text})=>{acc+=text+" ";$("#cmd").value=acc});d.onState(({state})=>{if(state=="idle"){const t=acc.trim();acc="";REC=null;$("#mic").classList.remove("on");if(t)run(t)}})}).catch(()=>{})}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
window.__st=()=>({S,R});window.__P=P;window.__run=run;window.__exp=exportMp4;window.__render=render;window.__seek=seekOut;
</script>
